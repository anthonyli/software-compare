name: Sync GitHub and deploy Cloudflare
on:
  push:
    branches: [main]
  schedule:
    # 09:17 Asia/Shanghai. GitHub may delay scheduled jobs.
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: software-compare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_SITE_URL: https://compare.sangmu.me
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Restore last published GitHub snapshot
        id: github-snapshot
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: github-data.json
          key: github-snapshot-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: github-snapshot-v1-
      - name: Sync GitHub only (keep official-site data unchanged)
        # Also refresh newly added repositories before publishing main pushes.
        run: node scripts/sync-github.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:e2e
        working-directory: site
      - run: npm run configure:cloudflare
        working-directory: site
      - name: Migrate and deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
        run: node scripts/deploy.mjs
      # Cache only after successful validation and deployment. No Git writes.
      - name: Cache published GitHub snapshot
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: github-data.json
          key: github-snapshot-v1-${{ github.run_id }}-${{ github.run_attempt }}
