name: Validate
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:e2e
        working-directory: site
      - name: Verify native carousel tab visibility
        run: xvfb-run -a npm run test:e2e -- tests/browser/labs-scenarios.spec.ts --headed --grep "another real browser tab"
        working-directory: site
      - name: Upload domain registration visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-registration-visual-previews
          path: docs/design/previews/domain-page-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload payment platform visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-platform-visual-previews
          path: docs/design/previews/payment-page-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload Labs homepage visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs-home-visual-previews
          path: docs/design/previews/labs-home-*.png
          if-no-files-found: error
          retention-days: 7
