<!-- Original illustration for Compare / 软件对比. No third-party marks. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" fill="none" role="img" aria-hidden="true">
  <rect width="480" height="260" fill="#E8F6FF"/>
  <rect width="480" height="260" fill="url(#wash-remote-desktop)" opacity="0.85"/>
  <defs>
    <linearGradient id="wash-remote-desktop" x1="0" y1="0" x2="480" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF9FF" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#D2DFE7" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft-remote-desktop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#111111" flood-opacity="0.10"/>
    </filter>
    <pattern id="dots-remote-desktop" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="translate(18,16)">
      <circle cx="1.2" cy="1.2" r="1.05" fill="#111111" opacity="0.35"/>
    </pattern>
  </defs>
  <ellipse cx="40" cy="200" rx="70" ry="45" fill="#FFFFFF" opacity="0.35"/>
  <ellipse cx="440" cy="36" rx="70" ry="48" fill="#FFFFFF" opacity="0.35"/>
  <rect width="480" height="260" fill="url(#dots-remote-desktop)" opacity="0.45"/>
  <g filter="url(#soft-remote-desktop)">
    
    <g transform="translate(86,48)">
      <rect width="220" height="140" rx="18" fill="#FFFFFF"/>
      <rect x="16" y="16" width="188" height="96" rx="10" fill="#D7E4EC"/>
      <rect x="92" y="140" width="36" height="14" fill="#FFFFFF"/>
      <rect x="70" y="152" width="80" height="8" rx="4" fill="#111111"/>
    </g>
    <g transform="translate(230,86)">
      <rect width="176" height="112" rx="16" fill="#FFFFFF"/>
      <rect x="14" y="14" width="148" height="72" rx="8" fill="#D2DFE7"/>
      <rect x="74" y="112" width="28" height="10" fill="#FFFFFF"/>
      <rect x="58" y="120" width="60" height="7" rx="3.5" fill="#111111"/>
      <path d="M118 48l18 8-18 8" fill="#111111"/>
    </g>
    
  </g>
</svg>
