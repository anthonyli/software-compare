    <rect x="168" y="78" width="168" height="112" rx="10" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="8 7"/>
    <rect x="160" y="70" width="10" height="10" rx="1.5" fill="#111111"/>
    <rect x="334" y="70" width="10" height="10" rx="1.5" fill="#111111"/>
    <rect x="160" y="180" width="10" height="10" rx="1.5" fill="#111111"/>
