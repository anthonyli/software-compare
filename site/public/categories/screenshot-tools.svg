  <rect width="480" height="260" fill="url(#dots-screenshot-tools)" opacity="0.45"/>
  <g filter="url(#soft-screenshot-tools)">
    
    <rect x="92" y="48" width="296" height="164" rx="16" fill="#FFFFFF"/>
    <rect x="114" y="70" width="200" height="108" rx="8" fill="#D9E8E0"/>
