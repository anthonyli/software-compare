<!-- Original illustration for Compare / 软件对比. No third-party marks. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" fill="none" role="img" aria-hidden="true">
  <rect width="480" height="260" fill="#FFE8D8"/>
  <rect width="480" height="260" fill="url(#wash-cleaners)" opacity="0.85"/>
  <defs>
    <linearGradient id="wash-cleaners" x1="0" y1="0" x2="480" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFEEE3" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#E7D2C4" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft-cleaners" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#111111" flood-opacity="0.10"/>
    </filter>
    <pattern id="dots-cleaners" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="translate(18,16)">
      <circle cx="1.2" cy="1.2" r="1.05" fill="#111111" opacity="0.35"/>
    </pattern>
  </defs>
  <ellipse cx="40" cy="40" rx="70" ry="50" fill="#FFFFFF" opacity="0.35"/>
  <ellipse cx="440" cy="200" rx="80" ry="50" fill="#FFFFFF" opacity="0.4"/>
  <rect width="480" height="260" fill="url(#dots-cleaners)" opacity="0.45"/>
  <g filter="url(#soft-cleaners)">
    
    <g transform="translate(86,70)">
      <rect width="70" height="88" rx="14" fill="#FFFFFF" transform="rotate(-8 35 44)"/>
      <rect x="64" y="8" width="70" height="88" rx="14" fill="#FFFFFF"/>
      <rect x="128" y="0" width="70" height="88" rx="14" fill="#FFFFFF" transform="rotate(8 163 44)"/>
    </g>
    <g transform="translate(300,58)">
      <circle cx="48" cy="48" r="48" fill="#FFFFFF"/>
      <path d="M32 50l12 12 22-26" fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g fill="#111111" opacity="0.9">
      <circle cx="132" cy="46" r="3.2"/>
      <circle cx="250" cy="40" r="2.4"/>
      <circle cx="214" cy="200" r="3"/>
      <circle cx="92" cy="196" r="2.2"/>
    </g>
    
  </g>
</svg>
