<!-- Original illustration for Compare / 软件对比. No third-party marks. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" fill="none" role="img" aria-hidden="true">
  <rect width="480" height="260" fill="#D9F3EA"/>
  <rect width="480" height="260" fill="url(#wash-screen-recorders)" opacity="0.85"/>
  <defs>
    <linearGradient id="wash-screen-recorders" x1="0" y1="0" x2="480" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4F6F0" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#C5DCD4" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft-screen-recorders" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#111111" flood-opacity="0.10"/>
    </filter>
    <pattern id="dots-screen-recorders" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="translate(18,16)">
      <circle cx="1.2" cy="1.2" r="1.05" fill="#111111" opacity="0.35"/>
    </pattern>
  </defs>
  <ellipse cx="60" cy="40" rx="70" ry="50" fill="#FFFFFF" opacity="0.4"/>
  <ellipse cx="430" cy="210" rx="80" ry="55" fill="#FFFFFF" opacity="0.4"/>
  <rect width="480" height="260" fill="url(#dots-screen-recorders)" opacity="0.45"/>
  <g filter="url(#soft-screen-recorders)">
    
    <rect x="108" y="54" width="264" height="152" rx="28" fill="#FFFFFF"/>
    <circle cx="240" cy="130" r="46" fill="none" stroke="#111111" stroke-width="8"/>
    <circle cx="240" cy="130" r="22" fill="#BB5847"/>
    <circle cx="240" cy="130" r="14" fill="#111111"/>
    <rect x="132" y="74" width="28" height="10" rx="5" fill="#7F8D88"/>
    <circle cx="328" cy="80" r="6" fill="#111111" opacity="0.85"/>
    
  </g>
</svg>
