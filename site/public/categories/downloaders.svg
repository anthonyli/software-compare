<!-- Original illustration for Compare / 软件对比. No third-party marks. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" fill="none" role="img" aria-hidden="true">
  <rect width="480" height="260" fill="#E5F4FF"/>
  <rect width="480" height="260" fill="url(#wash-downloaders)" opacity="0.85"/>
  <defs>
    <linearGradient id="wash-downloaders" x1="0" y1="0" x2="480" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECF7FF" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#D0DDE7" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft-downloaders" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#111111" flood-opacity="0.10"/>
    </filter>
    <pattern id="dots-downloaders" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="translate(18,16)">
      <circle cx="1.2" cy="1.2" r="1.05" fill="#111111" opacity="0.35"/>
    </pattern>
  </defs>
  <ellipse cx="80" cy="40" rx="70" ry="50" fill="#FFFFFF" opacity="0.35"/>
  <ellipse cx="400" cy="200" rx="80" ry="50" fill="#FFFFFF" opacity="0.4"/>
  <rect width="480" height="260" fill="url(#dots-downloaders)" opacity="0.45"/>
  <g filter="url(#soft-downloaders)">
    
    <g transform="translate(204,28)" fill="#111111">
      <rect x="20" y="8" width="32" height="96" rx="10"/>
      <path d="M6 96h60L36 150 6 96z"/>
    </g>
    <rect x="148" y="186" width="184" height="20" rx="10" fill="#FFFFFF"/>
    <rect x="154" y="191" width="112" height="10" rx="5" fill="#111111"/>
    
  </g>
</svg>
